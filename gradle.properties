org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# Set this to the exact NeoForge build in your pack if it differs
neo_version=21.1.172
neo_version_range=[21.1.0,)
loader_version_range=[4,)

mod_id=tarbound
mod_name=Tarbound
mod_license=MIT
mod_version=0.67.0-alpha
mod_group_id=com.tarbound
mod_authors=Kragnoth
mod_description=Low-tech storage and autocrafting. Pour tar to link your chests, read them all through a haunted radio, and bind spirits to your machines with skull-and-candle Reliquaries. Feed the spirits candles and they run your jobs.

# Recipe viewers (optional integrations). Pin jei_version to your pack's build if you prefer.
jei_version=19.+
emi_version=1.1.24+1.21.1
# Which viewer runClient loads: jei, emi or none
ponder_version=1.0.69
jade_version=15.10.6+neoforge
# Launch runClient with Jade too (true/false).
dev_jade=true
dev_recipe_viewer=emi
