plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.115'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'TerraformersMC (EMI)'
        url = 'https://maven.terraformersmc.com/'
        content { includeGroup 'dev.emi' }
    }
    maven {
        name = 'Modrinth (Jade)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CreateMod (Ponder)'
        url = 'https://maven.createmod.net'
        content { includeGroup 'net.createmod.ponder' }
    }
}

configurations {
    // Mods that are only on the dev runtime classpath (recipe viewer for testing).
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Recipe viewers are optional: compile against their APIs only.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // -Pemi_from_modrinth=true takes EMI from Modrinth's maven instead (when TerraformersMC's is unreachable).
    if (project.findProperty('emi_from_modrinth') == 'true') {
        compileOnly "maven.modrinth:emi:${emi_version}+neoforge"
    } else {
        compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    }
    // Jade is optional too: tooltips for the radio, Reliquaries and antennas when it's installed.
    compileOnly "maven.modrinth:jade:${jade_version}"
    if (project.dev_jade == 'true') {
        localRuntime "maven.modrinth:jade:${jade_version}"
    }
    // Ponder (ships inside Create) is optional: the "hold W" tutorial scenes. Compile against it only;
    // to see the scenes, run with Create installed (Ponder alone also needs Flywheel at runtime).
    compileOnly("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}") { transitive = false }

    // Pick which viewer `runClient` launches with: jei, emi, or none (gradle.properties: dev_recipe_viewer).
    if (project.dev_recipe_viewer == 'jei') {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    } else if (project.dev_recipe_viewer == 'emi') {
        localRuntime "dev.emi:emi-neoforge:${emi_version}"
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // ./gradlew runGameTestServer: boots a headless server, runs the playtests in com.tarbound.gametest, exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Ship the license inside the jar.
jar {
    from("LICENSE")
    // The headless playtests and their template are for dev runs only.
    exclude 'com/tarbound/gametest/**', 'data/tarbound/structure/gametest/**', 'data/tarbound/recipe/gametest/**'
}
